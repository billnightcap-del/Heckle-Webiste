# Builds the site and publishes it to GitHub Pages on every push to main.
# Site address: https://billnightcap-del.github.io/Heckle-Webiste/
# Analytics and the newsletter form switch on when these repository variables are set
# (Settings → Secrets and variables → Actions → Variables): VITE_GA_ID, VITE_BEEHIIV_EMBED_SRC.
# Pushes that only touch the seats' reports or memory don't redeploy.
name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore: ['reports/**', 'memory/**', 'agents/**', 'design/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_BEEHIIV_EMBED_SRC: ${{ vars.VITE_BEEHIIV_EMBED_SRC }}
          VITE_TMDB_KEY: ${{ vars.VITE_TMDB_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
